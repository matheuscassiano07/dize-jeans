<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada | DIZE Jeans</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#1f2742">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root { --anil: #1f2742; --anil-escuro: #161c33; --linha: #e2a64a; --sinal: #7fa8e8; --papel: #f3f0e8; --zap: #25d366; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; padding: 32px 16px;
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,.035) 0 2px, transparent 2px 5px),
      radial-gradient(120% 90% at 20% 10%, #2b3555, var(--anil) 55%, var(--anil-escuro));
    color: var(--papel); font-family: "Archivo", "Arial Narrow", system-ui, sans-serif; text-align: center;
  }
  main { max-width: 560px; }
  .num {
    font-weight: 900; font-style: italic; font-stretch: 125%; line-height: .85;
    font-size: clamp(110px, 32vw, 220px); letter-spacing: -.04em; margin: 0;
    position: relative; display: inline-block;
  }
  .num::after {
    content: ""; position: absolute; left: 44%; top: 4%; width: 10%; height: 96%;
    background: var(--sinal); transform: skewX(-22deg); mix-blend-mode: screen; opacity: .9;
    animation: risco 1.1s cubic-bezier(.2,.8,.2,1) .2s both;
  }
  @keyframes risco { from { transform: skewX(-22deg) scaleY(0); } to { transform: skewX(-22deg) scaleY(1); } }
  .costura { height: 0; border-top: 2px dashed var(--linha); margin: 28px auto; width: 0; animation: costura 1s .6s ease-out forwards; }
  @keyframes costura { to { width: 70%; } }
  h1 { font-size: clamp(24px, 5vw, 34px); font-stretch: 110%; margin: 0 0 10px; }
  p { margin: 0 0 28px; opacity: .85; line-height: 1.5; }
  .acoes { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a.btn {
    display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 999px;
    font-weight: 700; text-decoration: none; color: var(--anil-escuro); background: var(--papel);
    transition: transform .25s, background .25s;
  }
  a.btn:hover { transform: translateY(-2px); }
  a.btn--zap { background: var(--zap); }
  a:focus-visible { outline: 3px solid var(--linha); outline-offset: 3px; }
  small { display: block; margin-top: 36px; font-family: "IBM Plex Mono", monospace; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; opacity: .55; }
  @media (prefers-reduced-motion: reduce) { *, *::after { animation: none !important; } .costura { width: 70%; } }
</style>
</head>
<body>
<main>
  <p class="num" aria-hidden="true">404</p>
  <div class="costura" aria-hidden="true"></div>
  <h1>Essa peça saiu da arara.</h1>
  <p>A página que você procurou não existe mais (ou nunca existiu). O catálogo continua lá, do 36 ao 56.</p>
  <div class="acoes">
    <a class="btn" href="/#catalogo">Ver o catálogo</a>
    <a class="btn btn--zap" href="https://wa.me/5512983014355?text=Ol%C3%A1%2C%20DIZE!%20Vim%20pelo%20site%20e%20queria%20uma%20ajuda." target="_blank" rel="noopener">Falar no WhatsApp</a>
  </div>
  <small>DIZE Jeans · o jeans que vai até você</small>
</main>
</body>
</html>
